<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <title>Codex Relay — Mobile Codex CLI Bridge</title>

    <!-- xterm.js CSS -->
    <link
      rel="stylesheet"
      href="/vendor/xterm.css"
    />
    <!-- diff2html CSS -->
    <link
      rel="stylesheet"
      href="/vendor/diff2html.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Security Lock Screen Overlay (PIN / Token Gate) -->
    <div class="auth-overlay" id="auth-overlay">
      <div class="auth-card">
        <div class="auth-lock-icon">🔒</div>
        <h1 class="auth-title">Codex Relay 安全锁</h1>
        <p class="auth-desc">
          请输入终端显示的访问密码 (PIN / Token)，或直接用手机扫描终端二维码一键解锁。
        </p>
        <form id="auth-form" class="auth-form" autocomplete="off">
          <input
            type="password"
            id="auth-token-input"
            class="auth-input"
            placeholder="输入访问密码 / PIN 码"
            inputmode="text"
            required
          />
          <div class="auth-error" id="auth-error"></div>
          <button type="submit" class="auth-submit-btn" id="auth-submit-btn">
            解锁进入终端 →
          </button>
        </form>
      </div>
    </div>

    <div class="app-shell">
      <!-- Top Status Header -->
      <header class="topbar">
        <div class="brand">
          <span class="status-dot" id="ws-dot" title="WebSocket Disconnected"></span>
          <span class="brand-title">Codex Relay</span>
          <span class="branch-badge" id="git-branch">main</span>
        </div>
        <div class="topbar-actions">
          <span class="cwd-label" id="cwd-label" title="Workspace Directory">...</span>
          <a
            href="/qr"
            id="btn-qr"
            target="_blank"
            class="icon-btn"
            style="text-decoration: none"
            title="打开高清手机扫码页面"
          >
            📱 扫码
          </a>
          <button class="icon-btn" id="btn-restart" title="Restart PTY Session">
            ↻ Restart
          </button>
          <button class="icon-btn" id="btn-lock" title="Lock & Logout">
            🔒
          </button>
        </div>
      </header>
      <p id="connection-status" class="connection-status" role="status" aria-live="polite">未连接</p>

      <!-- View Switcher Tabs: Terminal vs Git Diff -->
      <nav class="tab-bar" role="tablist">
        <button
          class="tab-btn active"
          id="tab-btn-terminal"
          data-tab="terminal"
          role="tab"
          aria-selected="true"
        >
          <span>⌨️ Terminal (xterm.js)</span>
        </button>
        <button
          class="tab-btn"
          id="tab-btn-diff"
          data-tab="diff"
          role="tab"
          aria-selected="false"
        >
          <span>🔀 Git Diff</span>
          <span class="diff-badge" id="diff-count-badge">0</span>
        </button>
      </nav>

      <!-- Upper Half: Main Viewport (xterm.js Terminal & Git Diff Red/Green Preview) -->
      <main class="upper-viewport">
        <!-- Tab 1: xterm.js Terminal Container -->
        <section class="tab-panel active" id="panel-terminal" role="tabpanel">
          <div id="terminal-container" class="terminal-container"></div>
        </section>

        <!-- Tab 2: Git Diff Preview Container -->
        <section class="tab-panel" id="panel-diff" role="tabpanel">
          <div class="diff-toolbar">
            <div class="file-chips" id="file-chips">
              <button class="file-chip active" data-file="">All Changes</button>
            </div>
            <button class="refresh-diff-btn" id="btn-refresh-diff">⟳ Refresh</button>
          </div>
          <div id="diff-container" class="diff-container">
            <div class="empty-state">Loading Git diff...</div>
          </div>
        </section>
      </main>

      <!-- Lower Half: Thumb Control Zone -->
      <section class="lower-controls">
        <!-- Quick Command / Prompt Bar -->
        <p id="terminal-state" class="terminal-state" role="status" hidden></p>
        <form class="prompt-form" id="prompt-form" autocomplete="off">
          <input
            type="text"
            id="prompt-input"
            class="prompt-input"
            placeholder="Send prompt or command to Codex CLI..."
          />
          <button type="submit" class="send-btn" id="btn-send">Send ↵</button>
        </form>
        <p id="prompt-status" class="prompt-status" role="status" aria-live="polite"></p>
        <p id="action-status" class="action-status" role="status" aria-live="polite"></p>

        <!-- Auxiliary Terminal Keys -->
        <div class="quick-keys navigation-keys" role="group" aria-label="Menu navigation">
          <button type="button" class="key-btn" data-action="up" aria-label="Up arrow">↑ Up</button>
          <button type="button" class="key-btn" data-action="down" aria-label="Down arrow">↓ Down</button>
          <button type="button" class="key-btn" data-action="tab">Tab ⇥</button>
        </div>
        <div class="quick-keys">
          <button type="button" class="key-btn" data-action="start_codex">
            🚀 Run codex
          </button>
          <button type="button" class="key-btn" data-action="enter">
            Enter ↵
          </button>
          <button type="button" class="key-btn" data-action="esc">
            Esc
          </button>
          <button type="button" class="key-btn danger-subtle" data-action="ctrl_c">
            Ctrl+C
          </button>
        </div>

        <p class="key-hint">Numbered menu: ↑ / ↓ to select, then Enter. Use y / n only when the prompt asks for them.</p>

        <!-- Giant Thumb Approval Buttons -->
        <div class="thumb-approval-grid">
          <button
            type="button"
            class="thumb-btn approve-btn"
            id="btn-approve"
            data-action="approve"
          >
            <span class="thumb-icon">✓</span>
            <span class="thumb-title">Send y + Enter</span>
            <span class="thumb-subtitle">For y/n prompts</span>
          </button>

          <button
            type="button"
            class="thumb-btn reject-btn"
            id="btn-reject"
            data-action="reject"
          >
            <span class="thumb-icon">✕</span>
            <span class="thumb-title">Send n + Enter</span>
            <span class="thumb-subtitle">For y/n prompts</span>
          </button>
        </div>
      </section>
    </div>

    <!-- xterm.js & FitAddon scripts -->
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
